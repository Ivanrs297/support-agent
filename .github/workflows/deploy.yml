# STEPS 18, 19 and 20 — see README §18, §19 and §20.
#
# This is a work area. It parses and does nothing, so the Actions tab stays
# clean while you build it up. The finished version is
# `.github/workflows/deploy-solution.yml`, which is what keeps supportagent.lat
# running — read it after you have tried, not before.
#
# What you are building: merging to main reaches the host on its own.
#
#   on: push to main, with `paths` filters. Editing a lab or a runbook must not
#       restart production. Add a `concurrency` group — two SSM commands
#       rewriting the same .env and racing `docker compose up` is how a host
#       ends up serving an image nobody chose.
#
#   permissions: contents read, packages write, and `id-token: write`. That last
#       one is what allows the OIDC token exchange; without it the AWS step
#       fails with a message that does not mention it.
#
#   job 1 — test. Plain pytest. config.py demands GROQ_API_KEY and API_TOKEN at
#       import, so give them placeholders: nothing in the suite touches the
#       network.
#
#   job 2 — build. `runs-on: ubuntu-24.04-arm`, because the host is Graviton.
#       Building arm64 on an x86 runner under QEMU works and takes roughly ten
#       times as long.
#
#       Two traps live in this job:
#
#       - ghcr rejects a repository name containing capitals, and
#         `github.repository` gives you the owner's name verbatim. Lowercase it:
#         `ghcr.io/${GITHUB_REPOSITORY,,}`.
#       - Re-running a workflow rebuilds and re-pushes tags that already exist,
#         and ghcr answers a burst of those with a secondary rate limit — a 403
#         that reads exactly like a permissions problem and is not one. Check
#         whether the manifest is already there and skip the build if it is. A
#         commit maps to exactly one image.
#
#       Tag with both the commit SHA and `latest`. The SHA is what gets
#       deployed; `latest` is for humans reading the registry. Deploying a
#       moving tag leaves a rollback with no fixed point to return to.
#
#   job 3 — deploy. Assume the IAM role over OIDC, then `ssm:SendCommand`. No
#       SSH key in a secret, no long-lived AWS credential, port 22 closed.
#
#       Do NOT add `environment:` to this job. It rewrites the OIDC token's
#       subject claim and the IAM trust policy stops matching, which surfaces as
#       "Not authorized to perform sts:AssumeRoleWithWebIdentity" — see §16.
#
#       Check the host is registered with SSM before sending anything.
#       SendCommand answers a stopped instance, a wrong region and an
#       unregistered agent with the same opaque `InvalidInstanceId`.
#
#       AWS-RunShellScript runs your commands with /bin/sh, which on Ubuntu is
#       dash. `set -o pipefail` is a bashism and aborts the whole script with
#       "Illegal option". Use `set -eu` here and put anything needing bash in
#       deploy/remote-deploy.sh, invoked with bash on purpose.
#
#       `aws ssm wait` exits non-zero when the command failed. Read the status
#       explicitly and print both stdout and stderr, or a failed deploy is a
#       bare exit code with the reason still sitting on the host.

