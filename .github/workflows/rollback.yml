# STEP 20 — see README §20.
#
# A work area. The finished version is `rollback-solution.yml`.
#
# Deploys an earlier commit without reverting anything in git. Use it when
# production is broken and reverting, reviewing and merging would take longer
# than the outage is worth. The follow-up is still a revert PR: main and the
# host disagree until then, and the next merge to main deploys over this.
#
# What it has to do:
#
#   1. Take a full 40-character SHA as a workflow_dispatch input. Reject a short
#      one with a message saying why — images are tagged with the full SHA, and
#      a short one simply will not be found.
#
#   2. Confirm the image exists in ghcr BEFORE touching the host. Rolling back
#      to a tag that was never built leaves production down and the operator
#      out of ideas. Query the registry for the manifest.
#
#   3. Share the `concurrency` group with the deploy workflow, so a rollback and
#      a deploy cannot race each other onto the same host.
#
#   4. Same SSM path as the deploy. Same dash-not-bash caveat.
#
#   5. Say in the run summary that main still points somewhere else, and that a
#      revert PR is still owed. A rollback that leaves no trace is how a repo
#      and its production host quietly stop agreeing.

name: Rollback

